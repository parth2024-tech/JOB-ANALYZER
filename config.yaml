# Scheduler settings
scheduler:
  interval_hours: 4
  enabled: true

# User-specific location & role criteria
preferences:
  target_profile:
    # Strictly fresher and internship opportunities only (no experienced roles)
    fresher_and_internship_only: true
    # Strictly posted within maximum 2 weeks (14 days)
    max_age_days: 14
    # India: Any location in India (Office or Work From Home)
    india_all_locations: true
    # Worldwide: Opportunities all over the world (Remote or Onsite)
    global_all_locations: true
